<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to vijayphd.com</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://vijayphd.com/">
<script>
  // This account's GitHub username changed from vijaymbaphd to vijayphd. Old links to vijaymbaphd.github.io
  // are forwarded to the same path on vijayphd.github.io, which sends each site on to its own domain.
  (function () {
    var p = location.pathname;
    var to = /^\/vijay(\/|$)/.test(p) ? 'https://vijayphd.com/' : 'https://vijayphd.github.io' + p + location.search + location.hash;
    location.replace(to);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://vijayphd.com/">
</head>
<body>
<p>This page has moved to <a href="https://vijayphd.com/">vijayphd.com</a>.</p>
</body>
</html>
